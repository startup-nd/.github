name: Bug
description: Báo lỗi
type: Bug
labels: [needs-triage]
projects: ["startup-nd/1"]
body:
  - type: dropdown
    id: env
    attributes:
      label: Môi trường
      options: [dev, staging, production, local]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Service và image tag
      placeholder: order-service:main-a1b2c3d
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Bước tái hiện
      placeholder: |
        1. Gọi POST /orders với body ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Kết quả thực tế
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log / trace ID / ảnh chụp
      render: shell
